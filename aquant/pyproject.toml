[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aquant"
version = "0.1.0"
description = "A股量化回测与策略研究框架 —— 自包含引擎 + 带类型注解的干净调用层"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AQuant" }]
keywords = ["quant", "backtest", "a-share", "factor", "strategy"]
dependencies = [
    "pandas>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
aquant = "aquant.__main__:_main"

[tool.setuptools.packages.find]
where = ["."]
include = ["aquant*"]

[tool.setuptools.package-data]
aquant = ["py.typed"]
